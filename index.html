                    return padding + percentage * (height - padding * 2);

                    y: getYCoordinate(scores[dim]),
                    val: scores[dim],

                                y={getYCoordinate(2)} 
                                width={width - padding*2} 
                                height={getYCoordinate(-2) - getYCoordinate(2)} 
                                fill="#f1f5f9" 
                                opacity="0.7" 
                            />

                            {/* Standard Grid Lines */}

                                            y1={y} 
                                            x2={width - padding + 5} 
                                            y2={y} 
                                            stroke={isMid ? "#f43f5e" : "#e2e8f0"} 
                                            strokeWidth={isMid ? "1.5" : "1"}

                                        />
                                        <text x={padding - 10} y={y + 4} textAnchor="end" className="text-[9px] font-medium fill-slate-400">{tick}</text>
                                    </g>
                                );

                                        x2={x}

                                    />
                                );

                            {points.map((p) => (
                                <g key={p.label}>
                                    <circle cx={p.x} cy={p.y} r="6" fill="#2563eb" stroke="#ffffff" strokeWidth="2" className="cursor-pointer transition-all hover:r-8" />
